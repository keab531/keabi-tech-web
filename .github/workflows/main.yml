
name: Build and Deploy Keabi Tech

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build React Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Locate React project
        id: project
        shell: bash
        run: |
          if [ -f "package.json" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "keabi-tech-personal-website/package.json" ]; then
            echo "dir=keabi-tech-personal-website" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: package.json was not found."
            echo "Repository files:"
            ls -la
            exit 1
          fi

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm install --no-audit --no-fund

      - name: Build React website
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm run build

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.project.outputs.dir }}/dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
